{% extends "layout/base.html" %}
{% load static %}

{% block content %}
<div class="container-fluid">
    <div id='calendar'></div>
</div>

<!-- Modal para crear/editar citas -->
<div class="modal fade" id="citaModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Nueva Cita</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- Aquí puedes incluir un formulario para crear/editar citas -->
                <form id="citaForm">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="fecha" class="form-label">Fecha</label>
                        <input type="date" class="form-control" id="fecha" name="fecha" required>
                    </div>
                    <div class="mb-3">
                        <label for="hora_inicio" class="form-label">Hora Inicio</label>
                        <input type="time" class="form-control" id="hora_inicio" name="hora_inicio" required>
                    </div>
                    <div class="mb-3">
                        <label for="hora_fin" class="form-label">Hora Fin</label>
                        <input type="time" class="form-control" id="hora_fin" name="hora_fin" required>
                    </div>
                    <div class="mb-3">
                        <label for="motivo" class="form-label">Motivo</label>
                        <textarea class="form-control" id="motivo" name="motivo"></textarea>
                    </div>
                    <!-- Otros campos según sea necesario -->
                    <button type="submit" class="btn btn-primary">Guardar Cita</button>
                </form>
            </div>
        </div>
    <!-- Contenido del modal -->
</div>
{% endblock %}

{% block js %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/es.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar');
    const calendar = new FullCalendar.Calendar(calendarEl, {
        locale: 'es',
        initialView: 'timeGridWeek',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        events: '/api/citas/',
        selectable: true,
        select: function(info) {
            // Mostrar modal para nueva cita
            $('#citaModal').modal('show');
            // Aquí puedes cargar datos en el modal
        },
        eventClick: function(info) {
            // Mostrar modal para editar cita
            $('#citaModal').modal('show');
            // Cargar datos de la cita seleccionada
        }
    });
    calendar.render();
});
</script>
{% endblock %}
